*,*::before,*::after{box-sizing:border-box}

:root{
  --bg:#f3efe7;
  --panel:#fcfbf8;
  --ink:#201e1a;
  --ink-2:#5c564b;
  --muted:#938c7d;
  --line:#e8e2d6;
  --line-strong:#d8d0bf;
  --accent:#e39a2b;
  --accent-deep:#c9820f;
  --accent-soft:#fbf1df;
  --shadow-panel:0 1px 2px rgba(70,58,36,.04),0 24px 48px -32px rgba(70,58,36,.35);
}

html{height:100%}
body{
  margin:0;
  min-height:100%;
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Segoe UI",system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1100px 560px at 88% -12%,rgba(227,154,43,.12),transparent 62%),
    radial-gradient(900px 520px at -10% 108%,rgba(227,154,43,.07),transparent 60%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

button,input,textarea{font-family:inherit}
.hidden{display:none !important}

/* ---------- top bar ---------- */
.topbar{
  max-width:1440px;
  margin:0 auto;
  padding:20px 28px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{
  width:40px;height:40px;flex:none;
  border-radius:12px;
  display:grid;place-items:center;
  color:#fff;
  background:linear-gradient(145deg,#f2b04a,#dd8d1c);
  box-shadow:0 10px 22px -10px rgba(221,141,28,.75),inset 0 1px 0 rgba(255,255,255,.35);
}
.mark svg{width:21px;height:21px}
.brand h1{
  margin:0;font-size:16px;line-height:1.2;font-weight:650;letter-spacing:.01em;
}
.brand p{
  margin:3px 0 0;
  font-size:11px;color:var(--muted);letter-spacing:.16em;
}
.privacy{
  display:inline-flex;align-items:center;gap:7px;
  font-size:11.5px;color:#6e675a;
  background:rgba(255,255,255,.66);
  border:1px solid var(--line);
  padding:7px 12px;border-radius:999px;
  backdrop-filter:blur(8px);
  white-space:nowrap;
}
.privacy .dot{
  width:6px;height:6px;border-radius:50%;background:#61a05a;
  box-shadow:0 0 0 3px rgba(97,160,90,.14);
}

/* ---------- layout ---------- */
.workspace{
  max-width:1440px;
  margin:0 auto;
  padding:0 28px 22px;
  display:grid;
  grid-template-columns:376px minmax(0,1fr);
  gap:18px;
  height:calc(100vh - 98px);
  height:calc(100dvh - 98px);
  min-height:560px;
}

/* ---------- control panel ---------- */
.panel{
  display:flex;flex-direction:column;min-height:0;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow-panel);
  overflow:hidden;
}
.panel-body{
  flex:1;min-height:0;
  padding:2px 20px 6px;
  overflow-y:auto;
  scrollbar-width:thin;
  scrollbar-color:#dcd4c4 transparent;
}
.panel-body::-webkit-scrollbar{width:8px}
.panel-body::-webkit-scrollbar-thumb{background:#e3ddd1;border-radius:4px;border:2px solid var(--panel)}
.panel-body::-webkit-scrollbar-track{background:transparent}

.block{padding:18px 0;border-bottom:1px solid var(--line)}
.block:last-child{border-bottom:none}
.block-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-bottom:11px;
}
.block-head h2{
  margin:0;display:flex;align-items:center;gap:7px;
  font-size:12px;font-weight:650;color:#6c6557;letter-spacing:.1em;
}
.block-head h2::before{
  content:"";width:5px;height:5px;border-radius:1.5px;
  background:var(--accent);transform:rotate(45deg);
}

.link-btn{
  display:inline-flex;align-items:center;gap:5px;
  border:none;background:var(--accent-soft);color:#9a6a18;
  font-size:11.5px;font-weight:500;
  padding:5px 9px;border-radius:7px;cursor:pointer;
  transition:background .15s ease,color .15s ease;
}
.link-btn:hover{background:#f7e6c8;color:#7f5710}
.link-btn svg{width:12px;height:12px}

/* upload */
.dropzone{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:22px 16px 20px;text-align:center;
  border:1.5px dashed var(--line-strong);border-radius:14px;
  background:#faf8f3;cursor:pointer;
  transition:border-color .15s ease,background .15s ease,box-shadow .15s ease;
}
.dropzone:hover{border-color:#dcb273;background:#fcf8ef}
.dropzone.drag{
  border-color:var(--accent);background:var(--accent-soft);
  box-shadow:inset 0 0 0 2px rgba(227,154,43,.12);
}
.dz-icon{
  width:38px;height:38px;border-radius:11px;
  display:grid;place-items:center;
  background:#fff;border:1px solid var(--line);
  color:var(--accent-deep);margin-bottom:9px;
  box-shadow:0 4px 12px -6px rgba(70,58,36,.25);
}
.dz-icon svg{width:18px;height:18px}
.dz-title{font-size:13px;font-weight:600;color:var(--ink-2)}
.dz-sub{font-size:11px;color:var(--muted);margin-top:3px}

.file-row{
  display:flex;align-items:center;gap:11px;
  padding:9px;border:1px solid var(--line);border-radius:13px;
  background:#faf8f3;
}
.file-row img{
  width:46px;height:46px;flex:none;border-radius:9px;
  object-fit:cover;background:#e8e2d6;
  box-shadow:0 2px 6px rgba(70,58,36,.15);
}
.file-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.file-info strong{
  font-size:12.5px;font-weight:600;color:var(--ink-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.file-info span{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ghost-btn{
  border:1px solid var(--line-strong);background:#fff;color:var(--ink-2);
  font-size:11.5px;padding:5px 10px;border-radius:7px;cursor:pointer;
  transition:border-color .15s ease,color .15s ease;
}
.ghost-btn:hover{border-color:#dfaa5c;color:#9a6a18}

/* fields */
.fields{display:flex;flex-direction:column;gap:12px}
.field-label{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-bottom:6px;font-size:11px;color:var(--muted);letter-spacing:.03em;
}
.field-label b{font-weight:600;font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.input{
  width:100%;border:1px solid #e3ddcf;background:#f7f4ed;
  border-radius:9px;padding:9px 11px;
  font-size:13px;line-height:1.45;color:var(--ink);
  outline:none;
  transition:border-color .15s ease,background .15s ease,box-shadow .15s ease;
}
.input:hover{background:#f5f1e8}
.input:focus{background:#fff;border-color:#e6bd7d;box-shadow:0 0 0 3px rgba(227,154,43,.14)}
.input-time{font-size:15px;font-weight:600;letter-spacing:.05em;font-variant-numeric:tabular-nums}
textarea.input{resize:vertical;min-height:58px;max-height:132px;line-height:1.55}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:10px}

/* style controls */
.range{width:100%;height:20px;margin:0;accent-color:var(--accent);cursor:pointer}
.seg{
  display:grid;grid-template-columns:1fr 1fr;gap:3px;
  background:#f1ece2;padding:3px;border-radius:9px;
}
.seg button{
  border:none;background:transparent;border-radius:7px;
  padding:7px 4px;font-size:12px;color:#7c7466;cursor:pointer;
  transition:background .15s ease,color .15s ease,box-shadow .15s ease;
}
.seg button:hover{color:var(--ink-2)}
.seg button.active{
  background:#fff;color:var(--ink);font-weight:600;
  box-shadow:0 1px 3px rgba(70,58,36,.14);
}
.style-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.style-col{flex:1;min-width:0}
.style-col:last-child{display:flex;flex-direction:column;align-items:flex-start}
.color-swatch{
  position:relative;display:inline-flex;align-items:center;gap:8px;
  padding:7px 10px;border-radius:9px;
  background:#f7f4ed;border:1px solid transparent;
  cursor:pointer;min-width:104px;
  transition:border-color .15s ease,background .15s ease;
}
.color-swatch:hover{border-color:var(--line-strong)}
.color-swatch input{
  position:absolute;inset:0;width:100%;height:100%;
  opacity:0;cursor:pointer;border:none;padding:0;
}
.swatch-dot{
  width:16px;height:16px;flex:none;border-radius:50%;
  background:var(--swatch,#efa33c);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);
}
.swatch-hex{font-size:12px;color:#6b655a;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none;padding:4px 0}
.toggle input{position:absolute;opacity:0;width:0;height:0}
.toggle-track{
  position:relative;width:36px;height:21px;flex:none;
  border-radius:999px;background:#e3ddd1;transition:background .18s ease;
}
.toggle-track::after{
  content:"";position:absolute;top:2.5px;left:2.5px;
  width:16px;height:16px;border-radius:50%;background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.2);
  transition:transform .18s ease;
}
.toggle input:checked + .toggle-track{background:var(--accent)}
.toggle input:checked + .toggle-track::after{transform:translateX(15px)}
.toggle input:focus-visible + .toggle-track{outline:2px solid rgba(227,154,43,.45);outline-offset:2px}
.toggle-text{font-size:12px;color:var(--ink-2)}

/* download */
.panel-foot{
  flex:none;padding:14px 20px 16px;
  border-top:1px solid var(--line);background:#fff;
}
.btn-download{
  width:100%;height:44px;border:none;border-radius:11px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-size:13.5px;font-weight:650;color:#2a1c06;
  background:linear-gradient(180deg,#f0ab45,#e0941e);
  box-shadow:0 10px 22px -12px rgba(200,130,15,.85),inset 0 1px 0 rgba(255,255,255,.4);
  cursor:pointer;
  transition:filter .15s ease,transform .08s ease;
}
.btn-download:hover:not(:disabled){filter:brightness(1.04)}
.btn-download:active:not(:disabled){transform:translateY(1px)}
.btn-download:disabled{
  cursor:not-allowed;background:#f0ece3;color:#b0a795;box-shadow:none;
}
.btn-download svg{width:16px;height:16px}

/* ---------- stage ---------- */
.stage{
  position:relative;display:flex;flex-direction:column;min-height:0;
  background:linear-gradient(180deg,#1e2024,#121316);
  border:1px solid #2a2c30;border-radius:18px;
  overflow:hidden;
  box-shadow:0 24px 60px -32px rgba(24,20,12,.55);
}
.stage-bar{
  flex:none;height:49px;padding:0 18px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-bottom:1px solid rgba(255,255,255,.07);
  font-size:11.5px;color:#a49f94;letter-spacing:.06em;
}
.stage-title{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:#c9c4b9}
.stage-title::before{
  content:"";width:5px;height:5px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 3px rgba(227,154,43,.15);
}
.stage-meta{
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:11px;color:#7c776c;letter-spacing:.02em;font-variant-numeric:tabular-nums;
}
.stage-canvas{
  position:relative;flex:1;min-height:0;
  display:grid;place-items:center;
  padding:24px;overflow:hidden;cursor:pointer;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:22px 22px;
}
.stage-canvas.has-image{cursor:default}
.stage-canvas::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(60% 55% at 50% 45%,rgba(255,255,255,.05),transparent 70%);
}
.stage-canvas.dragging{outline:2px dashed var(--accent);outline-offset:-12px}
#preview{
  position:relative;display:block;
  max-width:100%;max-height:100%;
  border-radius:4px;
  box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);
}
.empty-tip{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;align-items:center;gap:9px;
  max-width:calc(100% - 40px);
  padding:11px 17px;border-radius:999px;
  border:1px solid rgba(255,255,255,.16);
  background:rgba(14,15,18,.55);
  backdrop-filter:blur(12px);
  color:#ded9cf;font-size:12px;text-align:center;
  pointer-events:none;
  box-shadow:0 12px 30px rgba(0,0,0,.35);
}
.empty-tip svg{width:15px;height:15px;flex:none;color:var(--accent)}
.stage-foot{
  flex:none;height:38px;padding:0 18px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-top:1px solid rgba(255,255,255,.06);
  font-size:11px;color:#6f6a61;letter-spacing:.02em;
}
.stage-foot b{font-weight:500;color:#8f8a80}

/* toast */
.toast{
  position:fixed;left:50%;bottom:28px;z-index:50;
  transform:translate(-50%,10px);
  padding:10px 16px;border-radius:10px;
  background:rgba(28,26,22,.92);color:#fff;
  font-size:12.5px;letter-spacing:.01em;
  box-shadow:0 16px 40px rgba(0,0,0,.25);
  opacity:0;pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;
  backdrop-filter:blur(8px);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- responsive ---------- */
@media (max-width:1120px){
  .workspace{grid-template-columns:340px minmax(0,1fr)}
}
@media (max-width:900px){
  .workspace{
    grid-template-columns:1fr;
    height:auto;min-height:0;
    padding:0 18px 24px;
  }
  .stage{order:1;height:min(76vh,640px)}
  .panel{order:2}
  .panel-body{overflow:visible}
  .topbar{padding:16px 18px 14px}
  .stage-canvas{padding:16px}
}
@media (max-width:560px){
  .workspace{padding:0 12px 20px;gap:12px}
  .topbar{padding:14px 14px 12px}
  .privacy{display:none}
  .brand p{letter-spacing:.12em}
  .stage{height:min(70vh,580px)}
  .stage-bar{padding:0 14px}
  .stage-foot{padding:0 14px}
  .stage-canvas{padding:12px}
  .empty-tip{font-size:11.5px;padding:9px 13px;gap:7px}
  .panel-body{padding:2px 16px 6px}
  .panel-foot{padding:12px 16px 14px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 8.5h3l1.5-2h7l1.5 2h3A1.5 1.5 0 0 1 21.5 10v8A1.5 1.5 0 0 1 20 19.5H4A1.5 1.5 0 0 1 2.5 18v-8A1.5 1.5 0 0 1 4 8.5Z"/>
        <circle cx="12" cy="13.6" r="3.6"/>
      </svg>
    </div>
    <div>
      <h1>照片水印</h1>
      <p>时间 · 天气 · 定位</p>
    </div>
  </div>
  <div class="privacy"><span class="dot"></span>本地处理 · 照片不会上传</div>
</header>

<main class="workspace">
  <aside class="panel">
    <div class="panel-body">

      <section class="block">
        <div class="block-head"><h2>照片</h2></div>
        <label class="dropzone" id="dropzone" for="fileInput">
          <span class="dz-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 15.5V4.5"/>
              <path d="m7.5 9 4.5-4.5L16.5 9"/>
              <path d="M5 15.5v3h14v-3"/>
            </svg>
          </span>
          <span class="dz-title">点击上传照片</span>
          <span class="dz-sub">或拖拽到这里 · 支持 Ctrl+V 粘贴</span>
          <input type="file" id="fileInput" accept="image/*" hidden>
        </label>
        <div class="file-row hidden" id="fileRow">
          <img id="thumb" alt="照片缩略图">
          <div class="file-info">
            <strong id="fileName">照片</strong>
            <span id="fileMeta"></span>
          </div>
          <button type="button" class="ghost-btn" id="replaceBtn">更换</button>
        </div>
      </section>

      <section class="block">
        <div class="block-head">
          <h2>水印内容</h2>
          <button type="button" class="link-btn" id="syncNow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="8.4"/><path d="M12 7.4V12l3 1.8"/>
            </svg>
            当前时间
          </button>
        </div>
        <div class="fields">
          <div>
            <div class="field-label"><span>时间</span></div>
            <input class="input input-time" id="timeText" maxlength="12" autocomplete="off" spellcheck="false" aria-label="水印时间">
          </div>
          <div class="two-col">
            <div>
              <div class="field-label"><span>日期</span></div>
              <input class="input" id="dateText" maxlength="24" autocomplete="off" spellcheck="false" aria-label="水印日期">
            </div>
            <div>
              <div class="field-label"><span>星期 / 天气</span></div>
              <input class="input" id="weatherText" maxlength="32" autocomplete="off" spellcheck="false" aria-label="水印星期与天气">
            </div>
          </div>
          <div>
            <div class="field-label"><span>定位</span><b>可换行</b></div>
            <textarea class="input" id="locationText" rows="2" maxlength="120" spellcheck="false" aria-label="水印定位"></textarea>
          </div>
        </div>
      </section>

      <section class="block">
        <div class="block-head"><h2>样式</h2></div>
        <div class="fields">
          <div>
            <div class="field-label"><span>水印大小</span><b id="sizeVal">100%</b></div>
            <input type="range" class="range" id="sizeRange" min="70" max="150" step="5" value="100" aria-label="水印大小">
          </div>
          <div>
            <div class="field-label"><span>位置</span></div>
            <div class="seg" id="alignSeg">
              <button type="button" class="active" data-align="left">左下角</button>
              <button type="button" data-align="right">右下角</button>
            </div>
          </div>
          <div class="style-row">
            <div class="style-col">
              <div class="field-label"><span>强调色</span></div>
              <label class="color-swatch" id="colorSwatch" style="--swatch:#efa33c">
                <span class="swatch-dot" aria-hidden="true"></span>
                <span class="swatch-hex" id="accentHex">#EFA33C</span>
                <input type="color" id="accentColor" value="#efa33c" aria-label="分隔线强调色">
              </label>
            </div>
            <div class="style-col">
              <div class="field-label"><span>文字阴影</span></div>
              <label class="toggle">
                <input type="checkbox" id="shadowToggle" checked aria-label="文字阴影开关">
                <span class="toggle-track" aria-hidden="true"></span>
                <span class="toggle-text" id="shadowLabel">开启</span>
              </label>
            </div>
          </div>
        </div>
      </section>

    </div>
    <div class="panel-foot">
      <button type="button" class="btn-download" id="downloadBtn" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4v10"/><path d="m8 10.5 4 4 4-4"/><path d="M5 19h14"/>
        </svg>
        下载水印照片
      </button>
    </div>
  </aside>

  <section class="stage">
    <div class="stage-bar">
      <div class="stage-title">预览</div>
      <div class="stage-meta" id="imageInfo">示例水印 · 上传照片后导出</div>
    </div>
    <div class="stage-canvas" id="canvasWrap">
      <canvas id="preview" role="img" aria-label="水印效果预览"></canvas>
      <div class="empty-tip" id="emptyTip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 15.5V4.5"/><path d="m7.5 9 4.5-4.5L16.5 9"/><path d="M5 15.5v3h14v-3"/>
        </svg>
        <span>上传照片后即可导出原图尺寸水印照</span>
      </div>
    </div>
    <div class="stage-foot">
      <span id="stageHint">水印按照片宽度自适应</span>
      <b>支持 JPG / PNG / WebP</b>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var state = {
    img: null,
    imgUrl: '',
    file: null,
    imgW: 0,
    imgH: 0,
    time: '',
    date: '',
    weather: '',
    location: '福建省宁德市福安市城南街道\n冰冰食品店',
    size: 1,
    align: 'left',
    accent: '#efa33c',
    shadow: true
  };

  var el = {
    fileInput: document.getElementById('fileInput'),
    dropzone: document.getElementById('dropzone'),
    fileRow: document.getElementById('fileRow'),
    thumb: document.getElementById('thumb'),
    fileName: document.getElementById('fileName'),
    fileMeta: document.getElementById('fileMeta'),
    replaceBtn: document.getElementById('replaceBtn'),
    time: document.getElementById('timeText'),
    date: document.getElementById('dateText'),
    weather: document.getElementById('weatherText'),
    location: document.getElementById('locationText'),
    syncNow: document.getElementById('syncNow'),
    size: document.getElementById('sizeRange'),
    sizeVal: document.getElementById('sizeVal'),
    alignSeg: document.getElementById('alignSeg'),
    accent: document.getElementById('accentColor'),
    accentHex: document.getElementById('accentHex'),
    colorSwatch: document.getElementById('colorSwatch'),
    shadow: document.getElementById('shadowToggle'),
    shadowLabel: document.getElementById('shadowLabel'),
    download: document.getElementById('downloadBtn'),
    preview: document.getElementById('preview'),
    wrap: document.getElementById('canvasWrap'),
    emptyTip: document.getElementById('emptyTip'),
    imageInfo: document.getElementById('imageInfo'),
    stageHint: document.getElementById('stageHint'),
    toast: document.getElementById('toast')
  };

  var ctx = el.preview.getContext('2d');
  var toastTimer = 0;

  /* ---------------- helpers ---------------- */

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  function weekdayName(d) {
    return ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'][d.getDay()];
  }

  function formatSize(bytes) {
    if (!bytes && bytes !== 0) return '';
    var mb = bytes / 1048576;
    if (mb >= 1) return mb.toFixed(1) + ' MB';
    return Math.max(1, Math.round(bytes / 1024)) + ' KB';
  }

  function toast(message) {
    el.toast.textContent = message;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.classList.remove('show'); }, 2200);
  }

  function roundRect(c, x, y, w, h, r) {
    var radius = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + radius, y);
    c.lineTo(x + w - radius, y);
    c.quadraticCurveTo(x + w, y, x + w, y + radius);
    c.lineTo(x + w, y + h - radius);
    c.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
    c.lineTo(x + radius, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - radius);
    c.lineTo(x, y + radius);
    c.quadraticCurveTo(x, y, x + radius, y);
    c.closePath();
  }

  function spacedWidth(c, text, tracking) {
    var chars = Array.from(String(text || ''));
    if (!chars.length) return 0;
    return c.measureText(String(text)).width + tracking * (chars.length - 1);
  }

  function drawSpaced(c, text, x, y, tracking) {
    var cursor = x;
    Array.from(String(text || '')).forEach(function (ch) {
      c.fillText(ch, cursor, y);
      cursor += c.measureText(ch).width + tracking;
    });
  }

  function wrapLines(c, text, maxWidth) {
    var raw = String(text || '').split(/\r?\n/);
    var lines = [];
    raw.forEach(function (part) {
      if (!part) { lines.push(''); return; }
      var line = '';
      Array.from(part).forEach(function (ch) {
        var next = line + ch;
        if (line && c.measureText(next).width > maxWidth) {
          lines.push(line);
          line = ch;
        } else {
          line = next;
        }
      });
      lines.push(line);
    });
    return lines.slice(0, 5);
  }

  function applyShadow(c, enabled, kind, u) {
    if (!enabled) {
      c.shadowColor = 'transparent';
      c.shadowBlur = 0;
      c.shadowOffsetY = 0;
      return;
    }
    if (kind === 'big') {
      c.shadowColor = 'rgba(0,0,0,.46)';
      c.shadowBlur = 10 * u;
      c.shadowOffsetY = 3.5 * u;
    } else {
      c.shadowColor = 'rgba(0,0,0,.6)';
      c.shadowBlur = 6.5 * u;
      c.shadowOffsetY = 2 * u;
    }
  }

  /* ---------------- drawing ---------------- */

  function drawScene(c, W, H) {
    c.clearRect(0, 0, W, H);
    if (state.img) {
      c.drawImage(state.img, 0, 0, W, H);
    } else {
      drawPlaceholder(c, W, H);
    }
    drawWatermark(c, W, H, state);
  }

  function drawPlaceholder(c, W, H) {
    var bg = c.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, '#26292e');
    bg.addColorStop(.52, '#1a1c20');
    bg.addColorStop(1, '#101114');
    c.fillStyle = bg;
    c.fillRect(0, 0, W, H);

    var glow = c.createRadialGradient(W * .8, H * .2, 0, W * .8, H * .2, Math.max(W, H) * .78);
    glow.addColorStop(0, 'rgba(233,161,60,.20)');
    glow.addColorStop(.45, 'rgba(233,161,60,.055)');
    glow.addColorStop(1, 'rgba(233,161,60,0)');
    c.fillStyle = glow;
    c.fillRect(0, 0, W, H);

    c.save();
    c.strokeStyle = 'rgba(255,255,255,.055)';
    c.lineWidth = Math.max(1, W * .0011);
    var cx = W * .79;
    var cy = H * .22;
    for (var i = 1; i <= 3; i++) {
      c.beginPath();
      c.arc(cx, cy, W * (.12 + i * .105), 0, Math.PI * 2);
      c.stroke();
    }
    c.restore();
  }

  function drawWatermark(c, W, H, s) {
    if (!W || !H) return;

    var base = Math.min(W, H * 1.6);
    var u = (base / 1000) * s.size;

    var marginX = 15 * u;
    var marginY = 21 * u;
    var bigSize = 118 * u;
    var timeScaleX = 1.12;
    var smallSize = 36 * u;
    var track = 0.1 * smallSize;
    var locLH = 43 * u;
    var gapTimeBar = 13 * u;
    var gapBarText = 29 * u;
    var barW = 9 * u;
    var barH = 64 * u;
    var gapWeatherLoc = 1.62 * smallSize;
    var dateGap = 1.3 * smallSize;

    var bigFont = '700 ' + bigSize + 'px "D-DIN Condensed","Bahnschrift Condensed","DIN Condensed","DIN Alternate",Impact,sans-serif';
    var smallFont = '300 ' + smallSize + 'px "D-DIN","PingFang SC","Microsoft YaHei Light","Microsoft YaHei","Hiragino Sans GB",sans-serif';

    c.save();
    c.textBaseline = 'alphabetic';
    c.fillStyle = '#ffffff';

    c.font = smallFont;
    var maxLineW = W - marginX * 2;
    var locLines = String(s.location || '').trim() ? wrapLines(c, s.location, maxLineW) : [];
    var n = locLines.length;

    c.font = bigFont;
    var timeText = String(s.time || '').trim();
    var timeW = timeText ? c.measureText(timeText).width * timeScaleX : 0;

    c.font = smallFont;
    var dateW = spacedWidth(c, String(s.date || ''), track);
    var weatherW = spacedWidth(c, String(s.weather || ''), track);
    var colW = Math.max(dateW, weatherW);

    var bottom = H - marginY;
    var weatherBaseline = n > 0 ? bottom - (n - 1) * locLH - gapWeatherLoc : bottom;
    var dateBaseline = weatherBaseline - dateGap;
    var dateTop = dateBaseline - 0.72 * smallSize;
    var barCenter = (dateTop + weatherBaseline) / 2;
    var timeBaseline = weatherBaseline + 0.5 * smallSize;

    var timeX;
    var barX;
    var dateX;
    if (s.align === 'right') {
      dateX = W - marginX - colW;
      barX = dateX - gapBarText - barW;
      timeX = barX - gapTimeBar - timeW;
    } else {
      timeX = marginX;
      barX = timeX + timeW + gapTimeBar;
      dateX = barX + barW + gapBarText;
    }

    /* location */
    if (n > 0) {
      c.font = smallFont;
      c.textAlign = s.align === 'right' ? 'right' : 'left';
      applyShadow(c, s.shadow, 'small', u);
      var locX = s.align === 'right' ? W - marginX : marginX;
      locLines.forEach(function (line, i) {
        if (!line) return;
        c.fillText(line, locX, bottom - (n - 1 - i) * locLH);
      });
    }

    /* date + weather */
    c.font = smallFont;
    c.textAlign = 'left';
    applyShadow(c, s.shadow, 'small', u);
    if (s.date) drawSpaced(c, s.date, dateX, dateBaseline, track);
    if (s.weather) drawSpaced(c, s.weather, dateX, weatherBaseline, track);

    /* accent bar */
    c.shadowColor = 'transparent';
    c.shadowBlur = 0;
    c.shadowOffsetY = 0;
    c.fillStyle = s.accent;
    roundRect(c, barX, barCenter - barH / 2, barW, barH, barW * 0.35);
    c.fill();

    /* big time */
    if (timeText) {
      applyShadow(c, s.shadow, 'big', u);
      c.fillStyle = '#ffffff';
      c.font = bigFont;
      c.textAlign = 'left';
      c.save();
      c.translate(timeX, timeBaseline);
      c.scale(timeScaleX, 1);
      c.fillText(timeText, 0, 0);
      c.restore();
    }

    c.restore();
  }

  /* ---------------- canvas sizing ---------------- */

  function draw() {
    var W = el.preview.width;
    var H = el.preview.height;
    if (!W || !H) return;
    drawScene(ctx, W, H);
  }

  function layoutCanvas() {
    var cs = getComputedStyle(el.wrap);
    var padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    var padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    var availW = Math.max(120, el.wrap.clientWidth - padX);
    var availH = Math.max(120, el.wrap.clientHeight - padY);
    var ar = state.img ? (state.imgW / state.imgH) : 0.75;

    var cssW = availW;
    var cssH = cssW / ar;
    if (cssH > availH) {
      cssH = availH;
      cssW = cssH * ar;
    }
    cssW = Math.max(60, Math.floor(cssW));
    cssH = Math.max(60, Math.floor(cssH));

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var bw = Math.round(cssW * dpr);
    var bh = Math.round(cssH * dpr);
    var maxW = 1600;
    if (bw > maxW) {
      bw = maxW;
      bh = Math.round(bw / ar);
    }

    el.preview.style.width = cssW + 'px';
    el.preview.style.height = cssH + 'px';
    el.preview.width = bw;
    el.preview.height = bh;
    draw();
  }

  /* ---------------- photo loading ---------------- */

  function loadFile(file) {
    if (!file) return;
    if (!file.type || file.type.indexOf('image/') !== 0) {
      toast('请选择图片文件');
      return;
    }
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.decoding = 'async';
    img.onload = function () {
      var oldUrl = state.imgUrl;
      state.img = img;
      state.imgUrl = url;
      state.file = file;
      state.imgW = img.naturalWidth;
      state.imgH = img.naturalHeight;

      el.thumb.src = url;
      el.fileName.textContent = file.name || '照片';
      el.fileMeta.textContent = img.naturalWidth + ' × ' + img.naturalHeight + ' · ' + formatSize(file.size);
      el.imageInfo.textContent = img.naturalWidth + ' × ' + img.naturalHeight + ' px';
      el.dropzone.classList.add('hidden');
      el.fileRow.classList.remove('hidden');
      el.emptyTip.classList.add('hidden');
      el.wrap.classList.add('has-image');
      el.download.disabled = false;
      el.stageHint.textContent = '水印按照片宽度自适应';

      layoutCanvas();
      if (oldUrl) URL.revokeObjectURL(oldUrl);
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      toast('照片读取失败，请更换一张试试');
    };
    img.src = url;
  }

  function exportPhoto() {
    if (!state.img) return;
    var maxSide = 7000;
    var ratio = Math.min(1, maxSide / Math.max(state.imgW, state.imgH));
    var W = Math.max(1, Math.round(state.imgW * ratio));
    var H = Math.max(1, Math.round(state.imgH * ratio));

    var c = document.createElement('canvas');
    c.width = W;
    c.height = H;
    var cx = c.getContext('2d');
    cx.fillStyle = '#000';
    cx.fillRect(0, 0, W, H);
    drawScene(cx, W, H);

    el.download.disabled = true;

    function done(blob) {
      el.download.disabled = false;
      if (!blob) {
        toast('导出失败，请重试');
        return;
      }
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      var baseName = state.file && state.file.name ? state.file.name.replace(/\.[^.]+$/, '') : '照片';
      a.href = url;
      a.download = baseName + '-水印.jpg';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
      toast('已导出原图尺寸照片');
    }

    if (c.toBlob) {
      c.toBlob(done, 'image/jpeg', 0.94);
    } else {
      var data = c.toDataURL('image/jpeg', 0.94);
      var bin = atob(data.split(',')[1]);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      done(new Blob([bytes], { type: 'image/jpeg' }));
    }
  }

  /* ---------------- interaction ---------------- */

  function bindDrop(zone, cls) {
    ['dragenter', 'dragover'].forEach(function (evt) {
      zone.addEventListener(evt, function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
        zone.classList.add(cls);
      });
    });
    zone.addEventListener('dragleave', function (e) {
      if (e.relatedTarget && zone.contains(e.relatedTarget)) return;
      zone.classList.remove(cls);
    });
    zone.addEventListener('drop', function (e) {
      e.preventDefault();
      e.stopPropagation();
      zone.classList.remove(cls);
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) loadFile(f);
    });
  }

  function syncNow() {
    var now = new Date();
    state.time = pad2(now.getHours()) + ':' + pad2(now.getMinutes());
    state.date = now.getFullYear() + '-' + pad2(now.getMonth() + 1) + '-' + pad2(now.getDate());
    var rest = (el.weather.value || '').replace(/^星期[日一二三四五六]\s*/, '').trim() || '晴 19°C';
    state.weather = weekdayName(now) + '    ' + rest;

    el.time.value = state.time;
    el.date.value = state.date;
    el.weather.value = state.weather;

    draw();
    toast('已同步当前时间');
  }

  function bindEvents() {
    el.time.addEventListener('input', function () { state.time = el.time.value; draw(); });
    el.date.addEventListener('input', function () { state.date = el.date.value; draw(); });
    el.weather.addEventListener('input', function () { state.weather = el.weather.value; draw(); });
    el.location.addEventListener('input', function () { state.location = el.location.value; draw(); });

    el.size.addEventListener('input', function () {
      state.size = Number(el.size.value) / 100;
      el.sizeVal.textContent = el.size.value + '%';
      draw();
    });

    el.alignSeg.addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-align]');
      if (!btn) return;
      state.align = btn.dataset.align;
      Array.prototype.forEach.call(el.alignSeg.querySelectorAll('button'), function (b) {
        b.classList.toggle('active', b === btn);
      });
      draw();
    });

    el.accent.addEventListener('input', function () {
      state.accent = el.accent.value;
      el.accentHex.textContent = state.accent.toUpperCase();
      el.colorSwatch.style.setProperty('--swatch', state.accent);
      draw();
    });

    el.shadow.addEventListener('change', function () {
      state.shadow = el.shadow.checked;
      el.shadowLabel.textContent = state.shadow ? '开启' : '关闭';
      draw();
    });

    el.syncNow.addEventListener('click', syncNow);

    el.fileInput.addEventListener('change', function () {
      var f = el.fileInput.files && el.fileInput.files[0];
      if (f) loadFile(f);
      el.fileInput.value = '';
    });

    el.replaceBtn.addEventListener('click', function () { el.fileInput.click(); });

    el.download.addEventListener('click', exportPhoto);

    el.wrap.addEventListener('click', function () {
      if (!state.img) el.fileInput.click();
    });

    document.addEventListener('paste', function (e) {
      if (!e.clipboardData) return;
      var items = Array.prototype.slice.call(e.clipboardData.items || []);
      var item = items.filter(function (it) { return it.type && it.type.indexOf('image/') === 0; })[0];
      if (item) {
        var f = item.getAsFile();
        if (f) loadFile(f);
      }
    });

    bindDrop(el.dropzone, 'drag');
    bindDrop(el.wrap, 'dragging');

    window.addEventListener('dragover', function (e) { e.preventDefault(); });
    window.addEventListener('drop', function (e) { e.preventDefault(); });

    var ro = new ResizeObserver(function () { layoutCanvas(); });
    ro.observe(el.wrap);
  }

  function init() {
    var now = new Date();
    state.time = pad2(now.getHours()) + ':' + pad2(now.getMinutes());
    state.date = now.getFullYear() + '-' + pad2(now.getMonth() + 1) + '-' + pad2(now.getDate());
    state.weather = weekdayName(now) + '   晴 19°C';

    el.time.value = state.time;
    el.date.value = state.date;
    el.weather.value = state.weather;
    el.location.value = state.location;

    bindEvents();
    layoutCanvas();

    if (document.fonts && document.fonts.load) {
      Promise.all([
        document.fonts.load('700 118px "D-DIN Condensed"'),
        document.fonts.load('400 36px "D-DIN"')
      ]).catch(function () {}).then(function () {
        layoutCanvas();
      });
    }
  }

  init();
})();
</script>
</body>
</html>
